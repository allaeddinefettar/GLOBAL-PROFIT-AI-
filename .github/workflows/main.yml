
name: GLOBAL PROFIT AI TITAN V4 KRAKEN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: titan-kraken-paper
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Run TITAN V4 Kraken
        run: python bot.py

      - name: Save paper trading state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f titan_kraken_state.json titan_kraken_trades.jsonl
          git diff --cached --quiet || git commit -m "Update TITAN Kraken paper state"
          git push
