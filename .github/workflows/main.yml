
      - name: Save paper trading state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f titan_kraken_state.json ]; then
            git add -f titan_kraken_state.json
          fi

          if [ -f titan_kraken_trades.jsonl ]; then
            git add -f titan_kraken_trades.jsonl
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update TITAN Kraken paper state"
            git push
          else
            echo "No paper trading files to update"
          fi
